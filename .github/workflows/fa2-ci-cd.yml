name: FA2 ExpiryLens CI-CD
on:
  push:
    branches: [main, 'feature/**']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: fa2-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: Build, test, quality and expiry gate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Set up Java 17
        uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Set up Node 22
        uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend
      - name: Static quality analysis
        run: npm run lint
        working-directory: frontend
      - name: Build frontend
        run: npm run build
        working-directory: frontend
      - name: Bundle frontend into backend
        run: mkdir -p backend/src/main/resources/static && cp -r frontend/dist/. backend/src/main/resources/static/
      - name: Build backend
        run: bash mvnw -B -DskipTests compile
        working-directory: backend
      - name: Unit and regression tests
        run: bash mvnw -B -Dtest=AuthServiceTest,ProductServiceTest test
        working-directory: backend
      - name: Expiry-Safety Quality Gate
        run: bash mvnw -B -Dtest=ExpirySafetyGateTest test
        working-directory: backend
      - name: Package and coverage report
        run: bash mvnw -B verify
        working-directory: backend
      - name: Generate actual CI report
        if: always()
        run: python scripts/ci_report.py
      - name: Upload tests and coverage
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: fa2-quality-reports
          path: |
            backend/target/surefire-reports/
            backend/target/site/jacoco/
            reports/
      - name: Publish deployable application artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: fa2-application
          path: backend/target/backend-0.0.1-SNAPSHOT.jar
  deploy-demo:
    name: Deploy to temporary demo environment and smoke test
    needs: verify
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@v8.0.2
        with:
          name: fa2-application
          path: deploy
      - name: Deploy verified JAR and check readiness
        run: |
          mkdir -p reports
          java -jar deploy/backend-0.0.1-SNAPSHOT.jar --spring.profiles.active=demo > reports/deployment.log 2>&1 &
          echo $! > reports/app.pid
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://localhost:8081/ > /dev/null; then exit 0; fi
            sleep 2
          done
          cat reports/deployment.log
          exit 1
      - name: Smoke test actual deployed API and UI
        run: python scripts/smoke_demo.py
      - name: Install browser for evidence capture
        run: pip install 'playwright==1.55.0' && python -m playwright install --with-deps chromium
      - name: Capture working app screenshots and video
        run: python scripts/capture_demo.py
      - name: Upload deployment evidence
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: fa2-deployment-evidence
          path: reports/
      - name: Stop temporary demo deployment
        if: always()
        run: test ! -f reports/app.pid || kill $(cat reports/app.pid) || true
